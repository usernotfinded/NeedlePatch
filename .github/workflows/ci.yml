name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - name: Check out repository
        # actions/checkout@v4. TODO: pin to a verified full commit SHA.
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v5. TODO: pin to a verified full commit SHA.
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: PIP_CONSTRAINT=constraints-dev.txt python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run lint
        run: python -m ruff check .

      - name: Audit dev tooling dependencies
        # NeedlePatch has no runtime dependencies; this scans dev/build tooling.
        run: python -m pip_audit -r constraints-dev.txt

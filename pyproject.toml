[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "needlepatch"
version = "0.1.0"
description = "Safe shell commands for tiny text edits by AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Natan Mucelli" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pip-audit>=2.7,<3",
  "pytest==9.0.3",
  "ruff==0.15.11",
]

[project.scripts]
needle = "needlepatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
